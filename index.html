<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A proposal for my princess 💍</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;500&family=Amiri&display=swap">
<style>
:root{color-scheme:light;--ac:#e11d63;--ink:#5a1a33}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#ffd6e0;color:var(--ink);font-family:'Poppins',system-ui,sans-serif;overflow:hidden}
.pg{position:absolute;inset:0;z-index:1;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(170px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto;transform:translateX(110%);transition:transform .9s cubic-bezier(.7,0,.2,1)}
.pg.act{transform:none}.pg.prev{transform:translateX(-110%)}
.pg.fin{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));justify-content:space-between}
h1,h2{font-family:'Dancing Script',cursive;color:var(--ac);margin:0 0 10px;font-weight:600}h2{font-size:2.6rem}
p{line-height:1.75;font-weight:300;margin:0 0 18px;font-size:1.1rem}
.btn{font:inherit;font-size:1.1rem;font-weight:500;border:0;border-radius:99px;padding:15px 34px;background:linear-gradient(135deg,var(--ac),#ff6b9a);color:#fff;box-shadow:0 8px 22px rgba(225,29,99,.35);cursor:pointer;animation:pl 1.8s infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.hid{display:none!important}
.card{background:#fffaf5;border-radius:14px;padding:32px 28px;max-width:500px;border:4px solid #ff2d78;box-shadow:0 0 0 3px #fff,0 0 0 6px #ff7aa8,0 20px 48px rgba(225,29,99,.5),-20px 0 26px -10px rgba(225,29,99,.65),20px 0 26px -10px rgba(225,29,99,.65)}
.pg.act .card{animation:up 1s .5s both}.pg.act .pair{animation:dr 1s .3s both}
@keyframes up{from{opacity:0;transform:translateX(60px)}}@keyframes dr{from{opacity:0;transform:translateY(-80px) rotate(-12deg)}}
.split{display:flex;gap:34px;align-items:center;justify-content:center;flex-wrap:nowrap;width:100%;max-width:900px}
/* envelope */
#eg{zoom:1.2;display:flex;flex-direction:column;align-items:center;transition:filter 1s,opacity 1s,transform 1s}
#eg.blur{filter:blur(7px);opacity:.45;transform:scale(.85)}
.env{position:relative;width:260px;height:170px;margin-top:120px;background:#ff8f9c;border-radius:6px;box-shadow:0 14px 34px rgba(150,40,70,.3);cursor:pointer;animation:bob 2s infinite}
.env.open{animation:none}@keyframes bob{50%{transform:translateY(-8px)}}
.lt{position:absolute;left:14px;right:14px;top:8px;height:140px;background:#fffaf5;border-radius:4px;transition:transform 1s .6s;z-index:1;font-family:'Dancing Script',cursive;font-size:1.3rem;padding-top:24px;color:var(--ac)}
.bd{position:absolute;inset:0;z-index:2;width:0;border-left:130px solid #ff7a8a;border-right:130px solid #ff7a8a;border-bottom:88px solid #ff9aa6;border-top:82px solid transparent;border-radius:6px}
.fl{position:absolute;top:0;left:0;border-left:130px solid transparent;border-right:130px solid transparent;border-top:96px solid #ff6a7c;transform-origin:top;transition:transform .6s;z-index:3}
.seal{position:absolute;left:50%;top:62px;margin-left:-16px;font-size:32px;z-index:4;transition:opacity .3s}
.env.open .fl{transform:rotateX(180deg);z-index:0}.env.open .lt{transform:translateY(-110px)}.env.open .seal{opacity:0}
#lc{position:absolute;left:50%;top:44%;translate:-50% -50%;width:min(88vw,440px);z-index:3}
#lc.show{animation:zm 1s both}@keyframes zm{from{opacity:0;scale:.3;rotate:-8deg}}
/* frames */
.pair{position:relative;width:clamp(140px,30vw,255px);aspect-ratio:4/5;cursor:pointer}
.fr{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#ffeef4);padding:10px 10px 36px;border-radius:10px;border:3px solid #ff4d8d;box-shadow:0 0 0 5px #fff,0 0 0 8px #ff9cbd,0 16px 38px rgba(225,29,99,.45);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;color:#b07a8a;transition:transform .9s cubic-bezier(.5,1.4,.5,1)}
.fr:before{content:"";position:absolute;top:-16px;left:50%;width:74px;height:22px;margin-left:-37px;background:rgba(255,77,141,.7);transform:rotate(-4deg);z-index:3}
.fr:after{content:"♥ forever";position:absolute;bottom:6px;font-family:'Dancing Script',cursive;font-size:1.25rem;color:var(--ac)}
.fr .in{position:absolute;inset:10px 10px 36px;background:#ffeef2;border:2px solid #ff8fb5;border-radius:6px;box-shadow:inset 0 0 14px rgba(225,29,99,.3);display:flex;align-items:center;justify-content:center;overflow:hidden}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.f1{z-index:2;transform-origin:bottom left}.f2{transform:rotate(4deg)}
.pair.flip .f1{transform:translate(-48%,4%) rotate(-30deg)}.pair.flip .f2{transform:rotate(0) scale(1.04)}
.up{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:15px;line-height:22px;z-index:4;cursor:pointer}
.hint{font-size:.88rem;margin-top:8px;opacity:.7}
#mus{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:30;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:19px;cursor:pointer}
.hb{position:fixed;bottom:-30px;z-index:0;animation:rs linear forwards;pointer-events:none}@keyframes rs{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
/* road, car, pandas */
#rd{position:fixed;left:0;right:0;bottom:0;height:100%;z-index:2;pointer-events:none}

#car{position:absolute;bottom:14px;width:156px;height:72px;transition:left 1.4s ease-in-out,bottom 1.4s ease-in-out}
#car svg.cr{position:absolute;inset:0;z-index:2;width:100%}
#car.drive{animation:bn .3s infinite alternate}@keyframes bn{to{transform:translateY(-2px)}}
.cp{position:absolute;left:14px;bottom:17px;width:70px;z-index:1}.cp2{left:84px;display:none}
.wh{animation:rt .5s linear infinite paused}#car.drive .wh{animation-play-state:running}@keyframes rt{to{transform:rotate(360deg)}}
.pd{position:absolute;z-index:3;width:118px;bottom:20px;transition:left 2.6s linear,transform .7s;transform-origin:bottom}
.pd svg{width:100%;display:block;transition:transform .7s}
#pa{display:none}
.pd.turnB svg{transform:perspective(300px) rotateY(-35deg)}
.pd.sit{transform:translateY(18px) scaleY(.84)}
.jump{animation:jp .6s}@keyframes jp{50%{transform:translateY(-46px)}}
.hap{animation:jp .55s infinite}
.lg,.ar{transition:transform .5s}
.hd{animation:tl 3s infinite ease-in-out}@keyframes tl{50%{transform:rotate(4deg)}}
.bl{transform-origin:50px 37px;animation:bk 4s infinite}@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.walk .lg.l,.walk .ar.r{animation:sw .4s infinite alternate}
.walk .lg.r,.walk .ar.l{animation:sw .4s infinite alternate-reverse}
@keyframes sw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.wave .ar.r,.hap .ar.r{animation:wv .35s infinite alternate}
.hap .ar.l{animation:wl .35s infinite alternate}
@keyframes wv{from{transform:rotate(-135deg)}to{transform:rotate(-170deg)}}@keyframes wl{from{transform:rotate(135deg)}to{transform:rotate(170deg)}}
.hold .ar.r{transform:rotate(-55deg)}.hold .ar.l{transform:rotate(30deg)}
.fw,.rg{position:absolute;font-size:36px;transition:transform 1.5s}
.fw{left:94px;top:70px;display:none}.fw.give{transform:translate(128px,-4px)}
.rg{left:92px;top:100px;font-size:24px;opacity:0}.rg.show{opacity:1;animation:pp .8s}@keyframes pp{from{scale:0}}.rg.slide{transform:translate(128px,-6px)}
.nm{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Dancing Script',cursive;font-size:1.4rem;color:var(--ac);background:#fff;padding:2px 12px;border-radius:12px;opacity:0;transition:opacity 1s}.nm.on{opacity:1}
#ayat{opacity:0;transition:opacity 1.5s}#ayat.on{opacity:1}
.ar2{font-family:'Amiri',serif;font-size:1.55rem;line-height:2;direction:rtl;margin:0}
.en{font-size:.88rem;max-width:460px;margin:0 auto 6px}
#cap{min-height:2.4em;font-family:'Dancing Script',cursive;font-size:1.95rem;color:var(--ac);margin:8px 0 10px}

.cb{animation:cbob 1.6s ease-in-out infinite;transform-origin:60px 130px}@keyframes cbob{50%{transform:translateY(-3px) rotate(1.5deg)}}
.hh{animation:hf 2.2s infinite}@keyframes hf{0%{transform:translateY(10px);opacity:0}50%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.cpl{width:100%;height:100%;display:block}
.split>div:first-child{flex:none}.split .card{flex:1;min-width:0}
@media(max-width:700px){.split{gap:16px}.split .card{padding:16px 12px;border-width:3px}.split h2{font-size:1.5rem}.split p{font-size:.78rem;line-height:1.5;margin-bottom:10px}.split .btn{font-size:.82rem;padding:10px 14px}.pair{width:36vw}.hint{font-size:.7rem}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<button id="mus">🎵</button><input type="file" id="mf" accept="audio/*" hidden>
<canvas id="fx"></canvas>
<div id="app"></div>
<div id="rd">
 <div id="car"><div class="cp"></div><div class="cp cp2"></div>
  <svg class="cr" viewBox="0 0 130 60"><path d="M4 46Q4 36 16 34L114 34Q126 36 126 46Z" fill="#ff5c8a"/><path d="M84 34L96 18L101 18L100 34Z" fill="#cfefff" opacity=".8"/><circle cx="122" cy="40" r="3" fill="#ffe28a"/><g class="wh" style="transform-origin:30px 48px"><circle cx="30" cy="48" r="10" fill="#333"/><path d="M30 40V56M22 48H38" stroke="#ddd" stroke-width="2"/></g><g class="wh" style="transform-origin:98px 48px"><circle cx="98" cy="48" r="10" fill="#333"/><path d="M98 40V56M90 48H106" stroke="#ddd" stroke-width="2"/></g></svg></div>
 <div class="pd" id="pa"><div class="nm">Muhammad Ali Sabir</div><span class="fw" id="fl">🌸</span><span class="rg" id="rg">💍</span></div>
 <div class="pd" id="pb"><div class="nm">Merab Khalid</div></div>
</div>
<script>
/* SETTINGS: photos = 10 image paths (restaurant x2, class x2, ground x2, park x2, random x2); music = audio path */
const C={music:"song.m4a",photos:["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg"]};
const L=["Restaurant 1","Restaurant 2","Class 1","Class 2","Ground 1","Ground 2","Park 1","Park 2","Random 1","Random 2"];
const S=[
["Where it felt special","Sitting across from you at that table, I realised some moments don't need words. But I must say first: I'm sorry. I have not forgotten my past mistakes, not even one. The times I hurt you, the times I didn't listen, the times my ego spoke louder than my love. I carry them with me, and I promise they will never happen again.","I'm listening 💌"],
["For every time I fell short","In every class, every chat, every little moment, you gave me your best, and sometimes I gave you less than you deserved. For every time I made you sad or stayed silent when you needed me, I am truly sorry. I learned from each mistake, and I am a better man because of you.","Tell me more →"],
["My promise of honesty","I promise to always be honest with you, even when it is hard. I promise to listen before I speak, to respect your feelings, and to never let small things become big wounds. You will never have to doubt me.","Go on →"],
["My promise of peace","I won't promise the moon with empty words. I promise real things: a call when you're low, patience when you're upset, a smile on your hardest days. I want to be your peace, the place where your heart rests without fear.","There's more? →"],
["Until my last breath","I promise to take care of you, to stand beside you, and to keep you safe and happy until my last breath. With Allah as my witness, my only wish is to walk through this life with you, today, tomorrow and always.","One last thing 💍"]];
const P=g=>`<svg viewBox="0 0 100 130"><g stroke="#2a2a2a" stroke-width="1.5"><g class="lg l" style="transform-origin:32px 108px"><ellipse cx="32" cy="118" rx="13" ry="9" fill="#2a2a2a"/></g><g class="lg r" style="transform-origin:68px 108px"><ellipse cx="68" cy="118" rx="13" ry="9" fill="#2a2a2a"/></g><ellipse cx="50" cy="88" rx="30" ry="33" fill="#fff"/><g class="ar l" style="transform-origin:21px 74px"><ellipse cx="21" cy="90" rx="9" ry="19" fill="#2a2a2a"/></g><g class="ar r" style="transform-origin:79px 74px"><ellipse cx="79" cy="90" rx="9" ry="19" fill="#2a2a2a"/></g><g class="hd" style="transform-origin:50px 62px"><circle cx="26" cy="17" r="10" fill="#2a2a2a"/><circle cx="74" cy="17" r="10" fill="#2a2a2a"/><circle cx="50" cy="40" r="30" fill="#fff"/><g class="bl" stroke="none"><ellipse cx="37" cy="38" rx="7" ry="9" fill="#2a2a2a" transform="rotate(-20 37 38)"/><ellipse cx="63" cy="38" rx="7" ry="9" fill="#2a2a2a" transform="rotate(20 63 38)"/><circle cx="38" cy="36" r="2.6" fill="#fff"/><circle cx="62" cy="36" r="2.6" fill="#fff"/></g><ellipse cx="50" cy="48" rx="4.5" ry="3.2" fill="#2a2a2a" stroke="none"/><path d="M44 54q6 5 12 0" fill="none"/><circle cx="31" cy="50" r="4" fill="#ffb3c6" opacity=".7" stroke="none"/><circle cx="69" cy="50" r="4" fill="#ffb3c6" opacity=".7" stroke="none"/>${g?'<path d="M64 10l-10 7 10 7z M64 10l10 7-10 7z" fill="#ff4d8d" stroke="none"/><circle cx="64" cy="17" r="3" fill="#e11d63" stroke="none"/>':''}</g></g></svg>`;
const SC=[["#ffe9d6","#c98f6b","🍽️"],["#e3f0ff","#9db9d9","📚"],["#e2f7df","#7fc47a","🌳"],["#ffe3f1","#8fd18a","🌷"],["#f0e6ff","#b9a2e6","✨"]];
const cpl=k=>{const t=SC[k>>1],f=k%2,hr=['💕','💞'][f];return `<svg class="cpl" viewBox="0 0 120 150" preserveAspectRatio="xMidYMid slice"><rect width="120" height="150" fill="${t[0]}"/><rect y="128" width="120" height="22" fill="${t[1]}"/><text x="${f?96:24}" y="28" font-size="20" text-anchor="middle">${t[2]}</text><g class="cb" ${f?'transform="translate(120 0) scale(-1 1)"':''}><ellipse cx="82" cy="78" rx="14" ry="17" fill="#5a2d1c"/><path d="M69 128l5-38h16l5 38z" fill="#ff6b9a"/><circle cx="82" cy="70" r="11" fill="#f5cfa0"/><path d="M71 68q11-14 22 0q-3-6-11-6t-11 6z" fill="#5a2d1c"/><circle cx="78" cy="71" r="1.3" fill="#333"/><circle cx="86" cy="71" r="1.3" fill="#333"/><path d="M78 75q4 3 8 0" stroke="#c0504d" fill="none"/><rect x="28" y="84" width="20" height="30" rx="6" fill="#5b8def"/><rect x="30" y="112" width="7" height="18" fill="#34495e"/><rect x="40" y="112" width="7" height="18" fill="#34495e"/><circle cx="38" cy="72" r="11" fill="#f5cfa0"/><path d="M27 70q2-14 12-13q9 0 10 13q-5-8-11-8t-11 8z" fill="#2c1b12"/><circle cx="34" cy="73" r="1.3" fill="#333"/><circle cx="42" cy="73" r="1.3" fill="#333"/><path d="M34 77q4 3 8 0" stroke="#c0504d" fill="none"/><path d="M48 96L72 98" stroke="#f5cfa0" stroke-width="5" stroke-linecap="round"/></g><text class="hh" x="60" y="62" font-size="18" text-anchor="middle">${hr}</text></svg>`};
const pr=k=>`<div class="fr ${k%2?'f2':'f1'}"><div class="in">${C.photos[k]?`<img src="${C.photos[k]}">`:cpl(k)}</div><label class="up" onclick="event.stopPropagation()">+<input type="file" accept="image/*" hidden data-k="${k}"></label></div>`;
let h=`<section class="pg"><div id="eg"><div class="env" id="env"><div class="lt">My dear Merab Khalid…</div><div class="fl"></div><div class="bd"></div><div class="seal">💌</div></div><div class="hint">Tap the envelope to open 💗</div></div><div class="card hid" id="lc"><h1>Dear Merab Khalid,</h1><p>I have something to say, something my heart has carried for a very long time. From the day you came into my life, everything became softer, brighter and more beautiful. Before I say it, let me take you through a few memories, and a few things I owe you.</p><button class="btn" data-n>Let's begin 🌸</button></div></section>`;
S.forEach((s,i)=>{h+=`<section class="pg"><div class="split"><div><div class="pair">${pr(i*2+1)}${pr(i*2)}</div><div class="hint">Tap the photo 👆</div></div><div class="card"><h2>${s[0]}</h2><p>${s[1]}</p><button class="btn" data-n>${s[2]}</button></div></div></section>`});
h+=`<section class="pg fin"><div id="ayat"><p class="ar2">وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً</p><p class="en">“And among His signs is that He created for you spouses from among yourselves so that you may find tranquility in them, and He placed between you love and mercy.” (Surah Ar-Rum 30:21)</p></div><div><div id="cap"></div><button class="btn hid" id="acc">Accept 💖</button></div></section>`;
const $=id=>document.getElementById(id);$('app').innerHTML=h;
const pgs=[...document.querySelectorAll('.pg')],W=innerWidth,car=$('car'),pa=$('pa'),pb=$('pb'),cap=$('cap');
document.querySelector('.cp').innerHTML=P(0);document.querySelector('.cp2').innerHTML=P(1);pa.insertAdjacentHTML('afterbegin',P(0));pb.insertAdjacentHTML('afterbegin',P(1));
const x0=6,xf=Math.max(6,W-296);pb.style.left=(W-124)+'px';car.style.left=x0+'px';
let cur=0,fin=0;
function go(n){pgs.forEach((p,i)=>{p.classList.toggle('act',i===n);p.classList.toggle('prev',i<n)});cur=n;car.style.left=(x0+(xf-x0)*n/6)+'px';car.classList.add('drive');if(n<6)setTimeout(()=>car.classList.remove('drive'),1500);else finale()}
go(0);car.classList.remove('drive');
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>go(cur+1));

$('env').onclick=function(){if(this.classList.contains('open'))return;this.classList.add('open');startM();setTimeout(()=>{$('eg').classList.add('blur');const l=$('lc');l.classList.remove('hid');l.classList.add('show')},2300)};
document.addEventListener('change',e=>{const f=e.target,k=f.dataset.k;if(k===undefined||!f.files[0])return;f.closest('.fr').querySelector('.in').innerHTML=`<img src="${URL.createObjectURL(f.files[0])}">`});
let au=null;const mf=$('mf');
const mk=s=>{au=new Audio(s);au.loop=true;au.volume=.5};
function startM(){if(!au&&C.music)mk(C.music);if(au)au.play().catch(()=>{})}
$('mus').onclick=()=>{if(!au&&C.music)mk(C.music);if(!au)mf.click();else au.paused?au.play().catch(()=>{}):au.pause()};
mf.onchange=()=>{if(mf.files[0]){mk(URL.createObjectURL(mf.files[0]));au.play()}};
setInterval(()=>{const s=document.createElement('span');s.className='hb';s.textContent=['💗','💕','🌸'][Math.random()*3|0];s.style.left=Math.random()*100+'vw';s.style.fontSize=14+Math.random()*16+'px';s.style.animationDuration=6+Math.random()*5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),11000)},900);
const T=(f,t)=>setTimeout(f,t);
function finale(){if(fin)return;fin=1;
 T(()=>car.classList.remove('drive'),1500);
 T(()=>{pb.classList.add('jump');cap.textContent='Merab, come, we are going for a ride 🚗💕'},1700);T(()=>{pb.classList.remove('jump');pb.style.display='none';document.querySelector('.cp2').style.display='block'},2400);T(()=>{car.classList.add('drive');car.style.transitionDuration='2.8s';car.style.left=(W/2-78)+'px';car.style.bottom=(innerHeight/2-96)+'px';$('rd').style.setProperty('--rb',(innerHeight/2-80)+'px')},2800);
 T(()=>{car.classList.remove('drive');cap.textContent='We are here! 💖'},5700);T(()=>{document.querySelector('.cp').style.display='none';document.querySelector('.cp2').style.display='none';pa.style.display='block';pb.style.display='block';pa.style.left=(W/2-124)+'px';pb.style.left=(W/2+6)+'px';pa.style.bottom=pb.style.bottom=(innerHeight/2-90)+'px';pa.classList.add('jump');pb.classList.add('jump')},6200);T(()=>{pa.classList.remove('jump');pb.classList.remove('jump');car.classList.add('drive');car.style.transitionDuration='2.2s';car.style.left='-200px'},7000);
 T(()=>{car.classList.remove('drive');pa.classList.add('wave');pb.classList.add('wave');cap.textContent='Hi Merab! 👋'},9400);
 T(()=>{pa.classList.remove('wave');pb.classList.remove('wave');cap.textContent='I have waited so long to ask you this…'},11600);
 T(()=>{pa.classList.add('sit','hold');$('fl').style.display='block';cap.textContent='Merab Khalid, will you marry me? Please accept it 🌸';$('acc').classList.remove('hid')},13800)}
$('acc').onclick=()=>{$('acc').classList.add('hid');pb.classList.add('turnB');$('fl').classList.add('give');cap.textContent='Thank you… 🥹';
 T(()=>$('rg').classList.add('show'),1600);T(()=>$('rg').classList.add('slide'),2700);T(()=>cap.textContent='Forever starts now 💍',3300);
 T(()=>{pa.classList.remove('sit','hold');pb.classList.remove('turnB');pa.classList.add('hap');pb.classList.add('wave');document.querySelectorAll('.nm').forEach(n=>n.classList.add('on'));$('ayat').style.opacity=1;cap.textContent='Yaaay! 🥳 Alhamdulillah 🤍';boom()},5200)};
const cv=$('fx'),cx=cv.getContext('2d');let F=[],on=0;cv.width=innerWidth;cv.height=innerHeight;
